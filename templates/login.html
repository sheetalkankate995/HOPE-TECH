
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOPE TECH - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #17143d, #45246f, #173d59);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 460px;
            padding: 35px;
            border-radius: 22px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            box-shadow: 0 10px 35px rgba(0,0,0,0.3);
            color: white;
            text-align: center;
        }

        .logo {
            font-size: 42px;
            margin-bottom: 8px;
        }

        h1 {
            margin: 5px 0;
            letter-spacing: 2px;
        }

        .tagline {
            color: #eadcff;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .section-title {
            text-align: left;
            margin: 20px 0 12px;
            font-size: 14px;
        }

        .roles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .role-card {
            padding: 15px 5px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 13px;
            cursor: pointer;
            background: rgba(255,255,255,0.08);
            transition: 0.2s;
        }

        .role-card:hover {
            background: rgba(255,255,255,0.2);
        }

        .role-card.selected {
            border-color: #f4a7ff;
            background: rgba(214,145,255,0.25);
            box-shadow: 0 0 12px rgba(244,167,255,0.4);
        }

        .role-icon {
            font-size: 27px;
            display: block;
            margin-bottom: 8px;
        }

        .role-name {
            font-size: 13px;
            font-weight: bold;
        }

        .field {
            text-align: left;
            margin-top: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .field input {
            width: 100%;
            padding: 13px;
            border: none;
            outline: none;
            border-radius: 9px;
            background: rgba(255,255,255,0.95);
            font-size: 14px;
        }

        .login-button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #c77dff, #f09acb);
            color: #24113b;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        .error {
            background: rgba(255,70,70,0.2);
            color: #ffd5d5;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
        }

        .links {
            margin-top: 22px;
            font-size: 14px;
            line-height: 2;
        }

        .links a {
            color: #f4c4ff;
            text-decoration: none;
            font-weight: bold;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .disclaimer {
            font-size: 11px;
            color: #e4d9f2;
            margin-top: 22px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">🌸</div>
    <h1>HOPE TECH</h1>

    <p class="tagline">
        Together Towards Awareness & Innovation.
    </p>

    <form action="{{ url_for('login') }}" method="POST"
          onsubmit="return validateRole()">

        <p class="section-title">👤 Select Your Role</p>

        <div class="roles">

            <div class="role-card"
                 onclick="selectRole('admin', this)">
                <span class="role-icon">👑</span>
                <span class="role-name">Admin</span>
            </div>

            <div class="role-card"
                 onclick="selectRole('faculty', this)">
                <span class="role-icon">👩‍🏫</span>
                <span class="role-name">Faculty</span>
            </div>

            <div class="role-card"
                 onclick="selectRole('student', this)">
                <span class="role-icon">🎓</span>
                <span class="role-name">Student</span>
            </div>

        </div>

        <input type="hidden" name="role" id="selectedRole">

        <div class="field">
            <label>📧 Email Address</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required>
        </div>

        <div class="field">
            <label>🔒 Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required>
        </div>

        <button type="submit" class="login-button">
            🚀 Sign In
        </button>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

    </form>

    <div class="links">
        Don't have an account?
        <a href="{{ url_for('register') }}">Register Here</a>
        <br>
        <a href="{{ url_for('home') }}">← Back to Home</a>
    </div>

    <p class="disclaimer">
        This platform is for educational and research purposes.
        Predictions are not medical diagnoses.
    </p>

</div>

<script>
    function selectRole(role, card) {

        document.getElementById("selectedRole").value = role;

        document.querySelectorAll(".role-card").forEach(function(item) {
            item.classList.remove("selected");
        });

        card.classList.add("selected");
    }

    function validateRole() {
        const role = document.getElementById("selectedRole").value;

        if (!role) {
            alert("Please select your role before signing in.");
            return false;
        }

        return true;
    }
</script>

</body>
</html>
