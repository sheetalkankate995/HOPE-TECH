
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOPE TECH - Register</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            background: linear-gradient(135deg, #24104f, #59318c, #9b65b5);
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            color: #70419b;
            font-size: 29px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            color: #42216c;
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: #42216c;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5c5e6;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus, select:focus {
            border-color: #7545a5;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            color: white;
            background: linear-gradient(90deg, #60358e, #9864b8);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 7px;
            text-align: center;
        }

        .error {
            color: #a00020;
            background: #ffe4e8;
        }

        .success {
            color: #176b36;
            background: #e1f7e8;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            line-height: 2;
            color: #666;
        }

        a {
            color: #70419b;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .note {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <i class="fa-solid fa-heart"></i> HOPE TECH
    </div>

    <p class="subtitle">
        Together Towards Awareness & Innovation
    </p>

    <h2>Create Your Account</h2>

    {% if error %}
        <div class="message error">
            {{ error }}
        </div>
    {% endif %}

    {% if success %}
        <div class="message success">
            {{ success }}
            <br>
            <a href="{{ url_for('login') }}">Go to Login</a>
        </div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}">

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username"
                   placeholder="Enter username"
                   minlength="3" maxlength="30"
                   pattern="[A-Za-z0-9_]+"
                   required>
            <p class="note">3–30 letters, numbers or underscores.</p>
        </div>

        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" name="mobile_number"
                   placeholder="Enter 10-digit mobile number"
                   pattern="[0-9]{10}" maxlength="10"
                   required>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="full_name"
                   placeholder="Enter your full name"
                   required>
        </div>

        <div class="form-group">
            <label>Age</label>
            <input type="number" name="age"
                   placeholder="Enter your age"
                   min="1" max="120" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Create password"
                   minlength="8" required>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password"
                   placeholder="Confirm password"
                   minlength="8" required>
        </div>

        <div class="form-group">
            <label>Select Your Role</label>
            <select name="role" required>
                <option value="">Choose Role</option>
                <option value="student">Student</option>
                <option value="faculty">Faculty</option>
            </select>
        </div>

        <button type="submit">
            <i class="fa-solid fa-user-plus"></i>
            Register Now
        </button>

    </form>

    <div class="links">
        Already have an account?
        <a href="{{ url_for('login') }}">Login</a>
        <br>
        <a href="{{ url_for('home') }}">
            <i class="fa-solid fa-house"></i> Back to Home
        </a>
    </div>

</div>

</body>
</html>
